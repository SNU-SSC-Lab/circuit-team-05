# SPEC 0017·0019: this team's actual RTL -> NSPL core -> proposed SOP28 GDS, as a merge gate.
# asic-gate: only checks named in verification/reliability/unverified.json (allows_checks) may stay
# unsupported; every other failure or missing check fails. reliability-table: KLayout DRC verdicts
# against the Calibre golden files. Both jobs always report (required checks) and skip heavy steps
# inside the job when the PR does not touch their inputs.
name: ASIC gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      experimental:
        description: 'Use the old fixed --experimental set instead of the unverified list (engineering trial, never submission approval)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: asic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asic-gate:
    name: asic-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the physical flow inputs changed
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # push and manual runs always run the flow; a PR runs it when it touches the flow's inputs.
          run=true
          if [ "$EVENT" = pull_request ]; then
            if changed=$(git diff --name-only "$BASE_SHA" HEAD); then
              printf '%s\n' "$changed"
              if ! printf '%s\n' "$changed" | grep -qE '^(src/|mychip/constraints/|scripts/|verification/|tests/(asic|physical|rtl)/|requirements-ci\.txt$|\.github/workflows/asic\.yml$)'; then
                run=false
              fi
            else
              echo 'Could not diff against the PR base; running the full flow.'
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        if: steps.paths.outputs.run == 'true'
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install synthesis, layout and comparison tools
        if: steps.paths.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          # libopengl0, libyaml-cpp0.8, libpython3.12t64, libgl1: shared libraries the fixed OpenROAD binary needs
          # (readelf NEEDED / ldd) that the Ubuntu 24.04 runner image does not ship.
          sudo apt-get install -y -qq --no-install-recommends yosys iverilog klayout netgen-lvs libtcl8.6 libgomp1 \
            libqt5widgets5 libqt5gui5 libqt5network5 libqt5printsupport5 libopengl0 libgl1 libyaml-cpp0.8 \
            libpython3.12t64 time > /dev/null
          python -m pip install -q -r requirements-ci.txt
      - name: Cache fixed OpenROAD packages
        if: steps.paths.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ssc-asic-downloads
          key: asic-ubuntu24-${{ hashFiles('verification/asic/tools.json') }}
      - name: Install and verify fixed OpenROAD
        if: steps.paths.outputs.run == 'true'
        run: |
          tools="$HOME/ssc-asic-tools"
          status=0
          python scripts/asic/setup_tools.py --out "$tools" --downloads "$HOME/ssc-asic-downloads" || status=$?
          # Name any shared library the runner still lacks, so the next fix is one apt package.
          missing=$(LD_LIBRARY_PATH="$tools/root/usr/lib/x86_64-linux-gnu:$tools/root/opt/or-tools/lib" \
            ldd "$tools/root/usr/bin/openroad" "$tools/root/usr/bin/sta" 2>&1 | grep 'not found' | sort -u || true)
          if [ -n "$missing" ]; then
            echo "::error::OpenROAD shared libraries not found on the runner:"
            printf '%s\n' "$missing"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Cache public NSPL archive
        if: steps.paths.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ssc-asic-archive
          key: nspl-archive-260820-2e49115a
      - name: Fetch and verify full NSPL views
        if: steps.paths.outputs.run == 'true'
        run: python scripts/asic/fetch_pdk.py --out "$RUNNER_TEMP/nspl" --archive "$HOME/ssc-asic-archive/NSPL_05CMOS_PDK_260820.tar.gz"
      - name: Match every active source DRC check (SPEC 0018)
        if: steps.paths.outputs.run == 'true'
        run: python scripts/asic/drc_catalog.py --pdk "$RUNNER_TEMP/nspl/NSPL_05CMOS_PDK_260820" --out "$RUNNER_TEMP/drc-catalog"
      - name: asic-unit and negative physical fixtures
        if: steps.paths.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests/asic -v
          python -m unittest discover -s tests/physical -v
          python scripts/asic/selftest.py --out "$RUNNER_TEMP/asic-selftest"
          python scripts/asic/drc_selftest.py --out "$RUNNER_TEMP/drc-selftest"
      - name: asic-build and gate decision
        if: steps.paths.outputs.run == 'true'
        env:
          EXPERIMENTAL: ${{ inputs.experimental || false }}
        run: |
          mode=--gate
          if [ "$EXPERIMENTAL" = true ]; then mode=--experimental; fi
          python scripts/run_asic.py --pdk "$RUNNER_TEMP/nspl/NSPL_05CMOS_PDK_260820" --openroad "$HOME/ssc-asic-tools/bin/openroad" --target chip --out .policy-tmp/asic-results "$mode"
      - name: Expanded geometry audit of core (not full-process DRC)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' && hashFiles('.policy-tmp/asic-results/v_ternary8_top.gds') != '' }}
        run: python scripts/asic/drc_audit.py --pdk "$RUNNER_TEMP/nspl/NSPL_05CMOS_PDK_260820" --gds .policy-tmp/asic-results/v_ternary8_top.gds --top v_ternary8_top --out .policy-tmp/drc-audit-core
      - name: Expanded geometry audit of proposed chip (not full-process DRC)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' && hashFiles('.policy-tmp/asic-results/ternary8_sop28.gds') != '' }}
        run: python scripts/asic/drc_audit.py --pdk "$RUNNER_TEMP/nspl/NSPL_05CMOS_PDK_260820" --gds .policy-tmp/asic-results/ternary8_sop28.gds --top ternary8_sop28 --out .policy-tmp/drc-audit-chip
      - name: Publish readable result
        if: ${{ !cancelled() }}
        env:
          RUN: ${{ steps.paths.outputs.run }}
        run: |
          if [ "$RUN" != true ]; then
            echo '# asic-gate: 물리 흐름 대상 변경 없음' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '이 PR은 `src/`, `mychip/constraints/`, `scripts/`, `verification/`, `tests/asic|physical|rtl/`, `requirements-ci.txt`, `.github/workflows/asic.yml`을 바꾸지 않아 합성·P&R·GDS·DRC·LVS를 건너뛰었습니다(SPEC 0019).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -f .policy-tmp/asic-results/summary.md ]; then
            cat .policy-tmp/asic-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ASIC build did not reach reporting. Read the failed setup step; no physical pass is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
          for summary in .policy-tmp/drc-audit-core/summary.md .policy-tmp/drc-audit-chip/summary.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Preserve result and evidence (also on failure)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .policy-tmp/asic-results/
            .policy-tmp/drc-audit-core/
            .policy-tmp/drc-audit-chip/
            ${{ runner.temp }}/asic-selftest/
            ${{ runner.temp }}/drc-selftest/
            ${{ runner.temp }}/drc-catalog/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  reliability-table:
    name: reliability-table
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the mutation corpus must be rebuilt
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # check-mutations takes about 8-13 minutes on GitHub runners, so a PR runs it only when DRC code or golden changes.
          run=true
          if [ "$EVENT" = pull_request ]; then
            if changed=$(git diff --name-only "$BASE_SHA" HEAD); then
              if ! printf '%s\n' "$changed" | grep -qE '^(scripts/asic/(drc[^/]*|mutate[^/]*|reliability)\.py$|verification/reliability/golden/|verification/asic/drc-rules\.json$|\.github/workflows/asic\.yml$)'; then
                run=false
              fi
            else
              echo 'Could not diff against the PR base; running the mutation check.'
            fi
          fi
          echo "mutations=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.3'
      - name: Install KLayout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends klayout > /dev/null
          klayout -v
      - name: DRC fixtures with KLayout
        id: selftest
        run: python scripts/asic/drc_selftest.py --out "$RUNNER_TEMP/drc-selftest"
      - name: Fixture verdicts against Calibre golden (every verified rule)
        if: ${{ !cancelled() }}
        run: |
          # drc_fixture_test.py writes selftest.json even when a fixture fails; without it nothing can be compared.
          if [ ! -f "$RUNNER_TEMP/drc-selftest/selftest.json" ]; then
            echo '::error::drc_selftest.py did not write selftest.json'
            exit 1
          fi
          python scripts/asic/reliability.py check --selftest "$RUNNER_TEMP/drc-selftest/selftest.json" --golden verification/reliability/golden --out "$RUNNER_TEMP/reliability-check"
      - name: Pending golden is bound to its fixture definitions
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python scripts/asic/reliability.py check-pending --golden verification/reliability/golden | tee "$RUNNER_TEMP/check-pending.txt"
      - name: Cache public NSPL archive
        if: ${{ !cancelled() && steps.paths.outputs.mutations == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ssc-asic-archive
          key: nspl-archive-260820-2e49115a
      - name: Fetch and verify full NSPL views
        if: ${{ !cancelled() && steps.paths.outputs.mutations == 'true' }}
        run: python scripts/asic/fetch_pdk.py --out "$RUNNER_TEMP/nspl" --archive "$HOME/ssc-asic-archive/NSPL_05CMOS_PDK_260820.tar.gz"
      - name: Mutation corpus verdicts against Calibre golden (both mutation golden files)
        if: ${{ !cancelled() && steps.paths.outputs.mutations == 'true' }}
        run: python scripts/asic/reliability.py check-mutations --kit "$RUNNER_TEMP/nspl/NSPL_05CMOS_PDK_260820" --out "$RUNNER_TEMP/reliability-mutations"
      - name: Publish readable result
        if: ${{ !cancelled() }}
        env:
          MUTATIONS: ${{ steps.paths.outputs.mutations }}
        run: |
          {
            echo '# reliability-table'
            echo ''
            if [ -f "$RUNNER_TEMP/reliability-check/summary.md" ]; then
              cat "$RUNNER_TEMP/reliability-check/summary.md"
            else
              echo 'fixture 대조가 결과를 만들지 못했습니다. 실패한 단계 로그를 확인하세요.'
            fi
            echo ''
            echo '## pending golden 묶음 확인'
            echo ''
            if [ -f "$RUNNER_TEMP/check-pending.txt" ]; then cat "$RUNNER_TEMP/check-pending.txt"; else echo '실행되지 않았습니다.'; fi
            echo ''
            if [ "$MUTATIONS" != true ]; then
              echo '## 변형본 대조: 건너뜀'
              echo ''
              echo '이 PR은 DRC 코드(`scripts/asic/drc*.py`, `scripts/asic/mutate*.py`, `scripts/asic/reliability.py`), golden(`verification/reliability/golden/`), `verification/asic/drc-rules.json`, `.github/workflows/asic.yml`을 바꾸지 않아 GitHub 실행기에서 약 8~13분 걸리는 변형본 대조를 건너뛰었습니다. main push에서는 항상 실행합니다.'
            elif [ -f "$RUNNER_TEMP/reliability-mutations/summary.md" ]; then
              cat "$RUNNER_TEMP/reliability-mutations/summary.md"
            else
              echo '변형본 대조가 결과를 만들지 못했습니다. 실패한 단계 로그를 확인하세요.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve result and evidence (also on failure)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/drc-selftest/
            ${{ runner.temp }}/reliability-check/
            ${{ runner.temp }}/check-pending.txt
            ${{ runner.temp }}/reliability-mutations/result.json
            ${{ runner.temp }}/reliability-mutations/summary.md
            ${{ runner.temp }}/reliability-mutations/*/result.json
            ${{ runner.temp }}/reliability-mutations/*/summary.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
