name: RTL CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.3'
      - name: pr-policy
        run: python scripts/ci_policy.py

  policy-unit:
    name: policy-unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.3'
      - name: policy-unit
        run: python -m unittest discover -s tests/policy -v

  rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ssc-tools/verilator-5.048
          key: ubuntu-24.04-verilator-5.048-${{ hashFiles('scripts/setup_rtl.sh') }}
      - name: Install RTL tools
        id: tools
        env:
          SSC_TOOL_PREFIX: ${{ runner.temp }}/ssc-tools
          SSC_TOOL_SOURCE: ${{ runner.temp }}/ssc-tool-source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog build-essential autoconf bison flex help2man libfl-dev zlib1g-dev
          python -m pip install -r requirements-ci.txt
          bash scripts/setup_rtl.sh
          echo "$SSC_TOOL_PREFIX/verilator-5.048/bin" >> "$GITHUB_PATH"
      - name: rtl-lint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python scripts/run_rtl.py lint
      - name: rtl-unit
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python scripts/run_rtl.py unit
      - name: rtl-integration
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python scripts/run_rtl.py integration
      - name: rtl-regression
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python scripts/run_rtl.py regression
      - name: rtl-coverage
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python scripts/run_rtl.py coverage
      - name: Record tested versions and results
        if: ${{ !cancelled() }}
        run: python scripts/ci_report.py
      - name: Upload RTL results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rtl-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .policy-tmp/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
