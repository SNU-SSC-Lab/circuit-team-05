[design]
top = "v_ternary8_top"
technology_name = ""  # Exact result of Magic 'tech name'; do not guess.
drc_style = ""        # Empty = kit default; actual style is recorded.
gds_input_style = ""  # Empty = kit default; confirm layer map and units.
timeout_seconds = 300

[files]
layout = ""          # Final uncompressed .gds; .mag also accepted locally.
schematic = ""       # SPICE/CDL with this top and complete transistor subcells.
magicrc = ""         # Reviewed, process-specific startup Tcl.
technology = ""      # Actual .tech file loaded by that startup Tcl.
netgen_setup = ""    # Reviewed process-specific device/pin/property rules.

[sha256]
layout = ""
schematic = ""
magicrc = ""
technology = ""
netgen_setup = ""

